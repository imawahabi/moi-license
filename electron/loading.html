<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التحميل...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            background: transparent; /* This is crucial for rounded corners */
            margin: 0;
            overflow: hidden;
            direction: rtl;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #2563eb 100%);
            color: white;
            border-radius: 10px; /* The requested rounded corners */
        }

        .loading-container {
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        .logo {
            width: 140px;
            height: 140px;
            background: rgba(0, 0, 0, 0.205);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: pulse 2s infinite;
        }

        .logo img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: brightness(1.1) contrast(1.1);
        }

        .system-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        .system-subtitle {
            font-size: 16px;
            margin-bottom: 50px;
            opacity: 0.85;
            font-weight: 500;
        }

        .loading-text {
            font-size: 18px;
            margin-bottom: 25px;
            opacity: 0.9;
            font-weight: 600;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
            margin: 0 auto;
        }

        .loading-dots {
            font-size: 20px;
            margin-top: 15px;
            opacity: 0.8;
            font-weight: 600;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60%, 100% {
                content: '...';
            }
        }

        .version {
            position: absolute;
            bottom: 25px;
            font-size: 13px;
            opacity: 0.6;
            font-weight: 500;
        }

        .ministry-header {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 13px;
            opacity: 0.8;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-container {
            margin-top: 30px;
            width: 200px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.6));
            border-radius: 2px;
            animation: progress 3s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0;
                transform: scale(0.95);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading-container">
        <div class="logo">
            <img src="logo.png"
                 alt="Ministry Logo"
                 onerror="this.src='../icons/icon.png'">
        </div>

        <h1 class="system-title">نظام متابعة الإستئذانات</h1>
        <p class="system-subtitle">الإدارة العامة لمكتب وكيل الوزارة</p>

        <div class="loading-text">جاري التحميل</div>

        <div class="loading-spinner"></div>

        <div class="progress-container">
        </div>
    </div>

    <div class="version">
        الإصدار 1.0.0
    </div>
    </div>
    <script>
        // تأثير النقاط المتحركة
        let dots = 0;
        const loadingMessages = [
            'جاري التحميل',
            'تحضير النظام',
            'تحميل البيانات',
            'تجهيز الواجهة'
        ];
        let messageIndex = 0;

        setInterval(() => {
            dots = (dots + 1) % 4;
            document.querySelector('.loading-dots').textContent = '.'.repeat(dots);
        }, 500);

        // تغيير رسالة التحميل
        setInterval(() => {
            messageIndex = (messageIndex + 1) % loadingMessages.length;
            document.querySelector('.loading-text').textContent = loadingMessages[messageIndex];
        }, 2000);

        // إخفاء شاشة التحميل بعد تحميل التطبيق الرئيسي
        window.addEventListener('message', (event) => {
            if (event.data === 'app-ready') {
                document.body.style.animation = 'fadeOut 0.5s ease-out forwards';
            }
        });

        // تأثير إضافي للوجو
        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.querySelector('.logo');
            setTimeout(() => {
                logo.style.transform = 'scale(1.05)';
                setTimeout(() => {
                    logo.style.transform = 'scale(1)';
                }, 300);
            }, 1000);
        });
    </script>
</body>
</html>
